<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music — Leah Mir</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gradient-bar"></div>

  <nav class="site-nav">
    <a href="index.html" class="site-nav__logo">Leah Mir</a>
    <ul class="site-nav__links" id="nav-links"></ul>
  </nav>

  <main class="page-wrap">

    <div class="inner-hero">
      <a href="index.html" class="inner-hero__back">&larr; Home</a>
      <h1>Music</h1>
      <span class="yellow-rule" style="margin-top:1rem;margin-bottom:1.25rem;"></span>
      <p>Recitals, recordings, and the sounds that shape the room.</p>
    </div>

    <!--
      ═══════════════════════════════════════════════
      HOW TO ADD A YOUTUBE VIDEO
      ═══════════════════════════════════════════════
      1. Go to your YouTube video
      2. Click Share → Embed
      3. Copy the URL inside src="..." — it looks like:
         https://www.youtube.com/embed/SOME_ID_HERE
      4. Copy one of the .video-item blocks below
      5. Replace the src URL and the title/year
      6. Upload the updated music.html to GitHub
      ═══════════════════════════════════════════════
    -->

    <div class="video-grid">

      <!-- ── Video 1 — Replace VIDEO_ID_HERE with your actual YouTube video ID ── -->
      <div class="video-item">
        <div class="video-item__embed">
          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID_HERE"
            title="Spring Recital 2024"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>
        <h3 class="video-item__title">Spring Recital</h3>
        <p class="video-item__meta">2024 &nbsp;&middot;&nbsp; Piano</p>
      </div>

      <!-- ── Add more video blocks below — copy the block above ── -->

    </div>

  </main>

  <footer class="site-footer">
    <div class="gradient-bar"></div>
    <p style="margin-top:1.5rem;">Leah Mir &nbsp;&middot;&nbsp; <span id="footer-year"></span></p>
  </footer>

  <script src="site-config.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    var navEl = document.getElementById('nav-links');
    SITE_CONFIG.sections.forEach(function (s) {
      var li = document.createElement('li');
      var a  = document.createElement('a');
      a.href        = s.href;
      a.textContent = s.title;
      if (s.id === 'music') a.classList.add('active');
      li.appendChild(a);
      navEl.appendChild(li);
    });
  </script>

</body>
</html>
