<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Leah Mir</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="gradient-bar"></div>

  <nav class="site-nav">
    <a href="index.html" class="site-nav__logo">Leah Mir</a>
    <ul class="site-nav__links" id="nav-links"></ul>
  </nav>

  <main class="page-wrap">

    <div class="inner-hero">
      <a href="index.html" class="inner-hero__back">&larr; Home</a>
      <h1>Writing</h1>
      <span class="yellow-rule" style="margin-top:1rem;margin-bottom:1.25rem;"></span>
      <p>Short pieces, long thoughts, and the occasional rebellion on the page.</p>
    </div>

    <!--
      ═══════════════════════════════════════════════
      HOW TO ADD A PIECE OF WRITING
      ═══════════════════════════════════════════════
      Copy one of the .writing-entry blocks below.
      Fill in the date, title, and excerpt.

      For the link (href):
        - If the piece is on Substack, Medium, or elsewhere:
          use that full URL, e.g. href="https://medium.com/..."
        - If you want to host it here:
          create a new .html file (like "essay-title.html")
          and set href="essay-title.html"

      Newest piece goes at the top.
      ═══════════════════════════════════════════════
    -->

    <div class="writing-list">

      <!-- ── Piece 1 — replace with your own ── -->
      <article class="writing-entry">
        <p class="writing-entry__date">May 2026</p>
        <h2 class="writing-entry__title">Your First Piece</h2>
        <p class="writing-entry__excerpt">
          Add your excerpt here — one or two sentences that earn the click.
          No spoilers. Just the hook.
        </p>
        <a href="#" class="writing-entry__link">Read &rarr;</a>
      </article>

      <!-- ── Copy this block to add another piece ── -->
      <!--
      <article class="writing-entry">
        <p class="writing-entry__date">January 2026</p>
        <h2 class="writing-entry__title">Second Piece Title</h2>
        <p class="writing-entry__excerpt">
          Excerpt goes here.
        </p>
        <a href="#" class="writing-entry__link">Read &rarr;</a>
      </article>
      -->

    </div>

  </main>

  <footer class="site-footer">
    <div class="gradient-bar"></div>
    <p style="margin-top:1.5rem;">Leah Mir &nbsp;&middot;&nbsp; <span id="footer-year"></span></p>
  </footer>

  <script src="site-config.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    var navEl = document.getElementById('nav-links');
    SITE_CONFIG.sections.forEach(function (s) {
      var li = document.createElement('li');
      var a  = document.createElement('a');
      a.href        = s.href;
      a.textContent = s.title;
      if (s.id === 'writing') a.classList.add('active');
      li.appendChild(a);
      navEl.appendChild(li);
    });
  </script>

</body>
</html>
